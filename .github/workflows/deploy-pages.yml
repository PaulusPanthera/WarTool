name: Import live data and deploy WARtool

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from minute 0 to reduce scheduler congestion.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an active Pages deployment finish. At most one newer run waits behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Show current Pages configuration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repository Pages configuration:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url, build_type, source, status}' || true

      - name: Import live Google Sheet data
        env:
          TEAM_SURPRISE_CSV_URL: ${{ vars.TEAM_SURPRISE_CSV_URL }}
          TEAM_MORE_LIKE_IT_CSV_URL: ${{ vars.TEAM_MORE_LIKE_IT_CSV_URL }}
          WAR_SETTINGS_CSV_URL: ${{ vars.WAR_SETTINGS_CSV_URL }}
        run: python tools/import_google_sheet.py

      - name: Validate WARtool data and static paths
        run: python tools/validate_static.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Build Pages artifact
        run: python tools/build_static_site.py

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          if find _site -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in a Pages artifact."
            exit 1
          fi
          file_count="$(find _site -type f | wc -l)"
          byte_count="$(du -sb _site | cut -f1)"
          largest_file="$(find _site -type f -printf '%s %p\n' | sort -nr | head -n 1)"
          echo "Artifact files: ${file_count}"
          echo "Artifact bytes: ${byte_count}"
          echo "Largest file: ${largest_file}"
          test "${byte_count}" -lt 1073741824

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # WARtool is about 60 MB unpacked. Give the Pages backend enough time
          # during periods of elevated deployment latency before cancelling it.
          timeout: 1800000
          error_count: 60
          reporting_interval: 10000
