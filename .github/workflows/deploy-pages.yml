name: Import live data and deploy WARtool

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every five minutes, offset from minute 0 to reduce scheduler congestion.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel a deployment just because the next five-minute run started.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import live Google Sheet data
        env:
          TEAM_SURPRISE_CSV_URL: ${{ vars.TEAM_SURPRISE_CSV_URL }}
          TEAM_MORE_LIKE_IT_CSV_URL: ${{ vars.TEAM_MORE_LIKE_IT_CSV_URL }}
          WAR_SETTINGS_CSV_URL: ${{ vars.WAR_SETTINGS_CSV_URL }}
        run: python tools/import_google_sheet.py

      - name: Validate WARtool data and static paths
        run: python tools/validate_static.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Build Pages artifact
        run: python tools/build_static_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
