name: Import live data and deploy WARtool

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from minute 0 to reduce scheduler congestion.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep only the newest WARtool deployment request. This prevents queued
  # five-minute refreshes from competing inside GitHub Pages.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import live Google Sheet data
        env:
          TEAM_SURPRISE_CSV_URL: ${{ vars.TEAM_SURPRISE_CSV_URL }}
          TEAM_MORE_LIKE_IT_CSV_URL: ${{ vars.TEAM_MORE_LIKE_IT_CSV_URL }}
          WAR_SETTINGS_CSV_URL: ${{ vars.WAR_SETTINGS_CSV_URL }}
        run: python tools/import_google_sheet.py

      - name: Validate WARtool data and static paths
        run: python tools/validate_static.py

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Build Pages artifact
        run: python tools/build_static_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's default is 10 minutes. Give a slow Pages backend more room.
          timeout: 900000
